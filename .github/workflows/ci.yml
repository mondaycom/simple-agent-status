name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Committed mod bundle must match the source
        run: git diff --exit-code -- mod/hooks/register.js
      - run: pnpm --filter tool-call-status typecheck
      - run: pnpm --filter tool-call-status test
      # The mod's `claude plugin test` is skipped: the runner has no Claude Code.
